<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Form Definitions</title></head>
<body>
<!-- Netlify Forms detection stub for the contact form.
     This file exists so Netlify's build scanner registers the form.
     It is not linked from the SPA and is never shown to users.
     v2 -->
<form name="contact" method="POST" netlify data-netlify="true" data-netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="contact" />
  <input type="text" name="name" />
  <input type="text" name="business-name" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="url" name="website" />
  <select name="requestType">
    <option value="">Select a service</option>
    <option value="free-website-review">Free Website Review</option>
    <option value="starter-website">Starter Website</option>
    <option value="core-website">Core Website</option>
    <option value="pro-website">Pro Website</option>
    <option value="website-redesign">Website Redesign</option>
    <option value="website-maintenance">Website Care</option>
    <option value="brand-direction">Brand Direction for a Website Project</option>
    <option value="advanced-functionality">Advanced Website Functionality</option>
    <option value="realtor-website">Real Estate Web Design</option>
    <option value="listing-mls-support">Listing / MLS Support</option>
    <option value="not-sure">Not Sure Yet</option>
    <option value="other">Other</option>
  </select>
  <textarea name="message"></textarea>
  <input type="text" name="brokerage" />
  <input type="text" name="serviceArea" />
  <input type="text" name="propertyAddress" />
  <input type="text" name="mlsNumber" />
  <input type="text" name="idxProvider" />
  <textarea name="realtorRequestDetails"></textarea>
  <input type="text" name="bot-field" />
  <button type="submit">Send</button>
</form>
</body>
</html>
