<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="JEa7UmnskXPz4yj87uY_XCfcI7HtQGa4UC4iQ413eYA" />
    <link rel="icon" type="image/png" href="/nlds/images/new-level-design-studio-nl-monogram-logo-charcoal.png" />
    <title>New Level Design Studio — Premium Websites for Local Businesses | Port Orange, FL</title>
    <meta name="description" content="Premium websites, visuals, and short-form content for local businesses in Port Orange, Daytona Beach, Volusia County, and Central Florida. Built for credibility, visibility, and conversion." />
    <link rel="canonical" href="https://newlvlstudio.com/" />

    <!-- Open Graph -->
    <meta property="og:title" content="New Level Design Studio — Premium Websites for Local Businesses" />
    <meta property="og:description" content="Premium websites, visuals, and short-form content for local businesses in Port Orange, Daytona Beach, Volusia County, and Central Florida." />
    <meta property="og:image" content="https://newlvlstudio.com/social-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://newlvlstudio.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="New Level Design Studio — Premium Websites for Local Businesses" />
    <meta name="twitter:description" content="Premium websites, visuals, and short-form content for local businesses in Port Orange, Daytona Beach, Volusia County, and Central Florida." />
    <meta name="twitter:image" content="https://newlvlstudio.com/social-preview.jpg" />

    <!-- LCP preload for hero background images -->
    <link rel="preload" as="image" type="image/webp" href="/nlds/images/new-level-design-studio-premium-website-hero-background.webp" media="(min-width: 1200px)" />
    <link rel="preload" as="image" href="/nlds/images/new-level-design-studio-premium-website-hero-background.jpg" media="(min-width: 1200px)" />
    <link rel="preload" as="image" type="image/webp" href="/nlds/images/new-level-design-studio-tablet-hero-background.webp" media="(min-width: 768px) and (max-width: 1199px)" />
    <link rel="preload" as="image" href="/nlds/images/new-level-design-studio-premium-website-hero-intro.jpg" media="(max-width: 767px)" />

    <!-- GA4 — set VITE_GA4_ID in .env to activate -->
    <script>
      (function() {
        var id = '%VITE_GA4_ID%';
        if (!id) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){window.dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Hidden form for Netlify Forms crawler — must match React form field names exactly -->
    <form name="contact" netlify data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business-name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="url" name="website" />
      <select name="service"></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
