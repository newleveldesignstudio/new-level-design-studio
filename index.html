  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Hidden form for Netlify Forms crawler — must match React form field names exactly -->
    <form name="contact" netlify data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" autocomplete="name" />
      <input type="text" name="business-name" autocomplete="organization" />
      <input type="email" name="email" autocomplete="email" />
      <input type="tel" name="phone" autocomplete="tel" />
      <input type="url" name="website" autocomplete="url" />
      <select name="service"></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" autocomplete="off" />
    </form>
  </body>
